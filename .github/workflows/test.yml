name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: podacha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d podacha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/podacha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  acceptance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: podacha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d podacha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/podacha
      REQUIRE_REAL_INITDATA: "1"
      TG_REAL_INITDATA: ${{ secrets.TG_REAL_INITDATA }}
      TG_TEST_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
      TG_REAL_INITDATA_TESTDC: ${{ secrets.TG_REAL_INITDATA_TESTDC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: tests must not skip
        run: set -o pipefail && npm test | tee test-out.txt && node scripts/check-no-skip.js test-out.txt
